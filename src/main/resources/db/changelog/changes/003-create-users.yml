databaseChangeLog:
  - changeSet:
      id: 003-create-users
      author: codex
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: login
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false
              - column:
                  name: email
                  type: varchar(320)
              - column:
                  name: display_name
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
        - sql:
            sql: >
              insert into users (login, created_at)
              select login, current_timestamp from subscriptions
              where login not in (select login from users)
        - addForeignKeyConstraint:
            baseTableName: subscriptions
            baseColumnNames: login
            referencedTableName: users
            referencedColumnNames: login
            constraintName: fk_subscriptions_users
            onDelete: CASCADE
