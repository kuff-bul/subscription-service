databaseChangeLog:
  - changeSet:
      id: 001-create-subscriptions
      author: codex
      changes:
        - createTable:
            tableName: subscriptions
            columns:
              - column:
                  name: login
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_subscriptions
                    nullable: false
              - column:
                  name: subscription_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
        - sql:
            dbms: postgresql
            sql: >
              alter table subscriptions
              add constraint chk_subscriptions_type
              check (subscription_type in ('FREE', 'PAID'))
